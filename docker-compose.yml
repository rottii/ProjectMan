services:
  # 1. VERİTABANI (PostgreSQL)
  postgres_db:
    image: postgres:15-alpine
    container_name: asana_postgres
    environment:
      POSTGRES_USER: asana_user
      POSTGRES_PASSWORD: asana_password
      POSTGRES_DB: asana_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. BACKEND (Node.js)
  backend:
    build: ./backend
    container_name: asana_backend
    restart: on-failure
    environment:
      - DATABASE_URL=postgresql://asana_user:asana_password@postgres_db:5432/asana_db?connection_limit=20&pool_timeout=10
      - PORT=5000
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    depends_on:
      - postgres_db

  # Prisma Studio (Database GUI)
  prisma_studio:
    build: ./backend
    container_name: asana_prisma_studio
    restart: on-failure
    ports:
      - "5555:5555"
    environment:
      - DATABASE_URL=postgresql://asana_user:asana_password@postgres_db:5432/asana_db?connection_limit=20&pool_timeout=10
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npx prisma studio --hostname 0.0.0.0
    depends_on:
      - postgres_db

  # 3. FRONTEND (React)
  frontend:
    build: ./frontend
    container_name: asana_frontend
    restart: on-failure
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # 4. REVERSE PROXY (Caddy)
  caddy:
    image: caddy:2-alpine
    container_name: asana_proxy
    restart: on-failure
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config: